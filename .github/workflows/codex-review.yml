name: Codex review

# Automated code review on pull requests, using the official openai/codex-action.
#
# Deliberately split into two jobs: `review` runs Codex over the PR's code with
# `contents: read` and no credentials persisted, while `post_feedback` holds the
# write token and only handles the resulting text. The job that touches
# untrusted PR code therefore never has permission to write to the repo.
#
# Requires an OPENAI_API_KEY secret:
#   gh secret set OPENAI_API_KEY --repo emanuelzaveruka/zvk
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review changes
    runs-on: ubuntu-latest
    # Skip drafts, and skip forks — secrets aren't exposed to fork PRs, so the
    # action would fail with an empty API key rather than review anything.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Pre-fetch base and head refs for the PR
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }} for
            ${{ github.repository }} — a static Astro 5 + Tailwind portfolio and
            blog deployed to GitHub Pages.

            Review ONLY the changes this PR introduces against
            origin/${{ github.event.pull_request.base.ref }}. Do not comment on
            pre-existing code the PR does not touch.

            Read AGENTS.md and CLAUDE.md first if present; they define the
            project's conventions. Beyond ordinary correctness review, this
            codebase has specific invariants that break silently — the build
            still succeeds when they are violated, so call them out explicitly:

            - Every page must pass its own `seo` prop to the Document layout, as
              a nested object. A page that omits it inherits the home page's
              title, description and canonical URL, which makes search engines
              treat it as a duplicate of `/`. Flag any new page missing it.
            - Post links must be built with `postPath()` from
              `src/util/get-post.ts`, not hand-written `/blog/${slug}`.
            - Canonical URLs, sitemap entries, RSS links and internal hrefs must
              all agree on the same trailing-slash form.
            - New content filenames must be ASCII — the filename becomes the URL
              slug, and accents produce percent-encoded URLs.
            - `getStaticPaths` must use the filtered `posts` export, never a raw
              `getCollection`, or unpublished drafts get built and indexed.
            - Changing a slug or route requires a matching entry in the
              `redirects` map in `astro.config.mjs`.
            - Fonts must stay self-hosted via `@fontsource`; a Google Fonts
              `<link>` blocks first paint.

            Be concise and specific. Reference file paths and line numbers.
            Prioritise real defects over style nits. If the changes look sound,
            say so briefly rather than inventing concerns.

            Pull request title and body:
            ----
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}

  post_feedback:
    name: Post review comment
    runs-on: ubuntu-latest
    needs: review
    if: needs.review.outputs.final_message != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Report Codex feedback
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 Codex review\n\n${process.env.CODEX_FINAL_MESSAGE}`,
            });
