name: Deploy static content to Pages

# Real deploy. Runs on merges into main (a merge is a push), on the daily
# schedule, and on demand. Pull requests are handled by ci.yml, which builds
# without deploying.
on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: "0 15 */1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  # Don't cancel a deploy midway — an interrupted one can leave Pages serving
  # a half-published state. Queue instead.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node and restore cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      # Gate the deploy on the same assertions CI runs, so broken metadata
      # can't reach production even via the schedule or a direct push.
      - name: Check SEO output
        run: pnpm check:seo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
